on and hypothesis, and defend why it matters","One-page proposal passes all eight Heilmeier questions in a live defence"),pn(3,"Methodologist","Weeks 13–22","Design a study, choose and justify methods and statistics, handle data reproducibly and ethically","Replicate one published result, with code, data notes and a preregistration-style plan"),pn(4,"Author","Weeks 23–32","Write a paper people can review: abstract, introduction (CARS), methods, results, limitations; review others’ papers","Workshop-length paper or preprint that “Reviewer 2” scores as a weak accept or better, plus two peer reviews written"),pn(5,"Communicator","Runs alongside levels 2–6","Give a 10-minute talk and a poster pitch, handle hostile questions, write to a professor, chair a discussion","Mock conference: talk plus 10 minutes of Q&A, scored on clarity, accuracy and composure"),pn(6,"Independent researcher","Weeks 33–52","Set a research agenda, extend your replication into original work, pitch a grant, mentor a newcomer","Mock viva: 60 minutes with a three-person AI committee on your own project")]},{id:"pillars",title:"Six skill pillars",meta:"Each one leaves an artefact",family:"method",detail:[{kind:"text",text:"Every lesson, drill and test belongs to one pillar. Each pillar leaves an artefact you can show a supervisor, an admissions panel or an employer, so the track builds a portfolio as it teaches."}],children:[jn("read","Read","Three-pass reading, critical appraisal, synthesis across papers","Keshav’s three passes; claim / evidence / limitation cards","Paper cards and a field map of 30 to 100 papers"),jn("think","Think","Problem choice, gaps, questions, hypotheses, contribution","Hamming’s important problems; Alon’s feasibility-versus-interest map; Heilmeier’s eight questions","One-page proposals, a research agenda"),jn("do","Do","Study design, statistics, data, code, reproducibility, ethics","Lakens on inference; McElreath on causal models; The Turing Way; preregistration on OSF; Missing Semester for tools","A replication repository and a preregistered plan"),jn("write","Write","Paper structure, clear sentences, related work, reviewing","Swales’ CARS introductions; Whitesides’ outline-first; Mensh & Kording’s ten rules; Peyton Jones: write to do the research","A preprint draft and two peer reviews"),jn("speak","Speak","Terms in context, hedging, talks, Q&A, viva, emails to professors","Peyton Jones’ research talk; phrasebank moves; iReliabee’s live coach and mock panels","Recorded talks with scores, a viva transcript"),jn("operate","Operate","Tools, integrity, collaboration, authorship, working with a mentor","Zotero, Semantic Scholar, Connected Papers; lab handbooks (Poldrack, Peelle, Aly); UKRIO and ORI on integrity","A working literature setup and a mentor agreement")]},{id:"rhythm",title:"The lab rhythm",meta:"Daily, weekly, monthly",family:"method",detail:[{kind:"text",text:"The track copies how a good lab runs its week, so a newcomer builds the habits of one before joining one. The home screen shows today’s list; each item takes one click to start."},{kind:"callout",text:"When the learner joins a real lab or supervisor, the same routine moves to real meetings: the live coach listens in lab meetings and journal clubs and prompts the right terms, just as it does in interviews today."}],children:[{id:"rhythm-daily",title:"Daily",meta:"About 35 to 55 minutes",detail:[{kind:"text",text:"Three short reps that keep reading, recall and speaking moving every day."}],children:[zt("retrieval","Retrieval reps","10","Spaced flashcards for terms and paper cards due today; you answer aloud, the app scores what you said"),zt("reading","One reading pass","20–40","Opens the next paper at the right pass; you fill the card as you go"),zt("speaking","One speaking rep","5","Explain a concept in 60 seconds, or use 3 new terms in an answer; scores accuracy, term use, hedging and filler words")]},{id:"rhythm-weekly",title:"Weekly",meta:"Journal club, lab meeting, ing",title:"Strength of claim",meta:"A five-step hedging ladder",detail:[{kind:"text",text:"New researchers overclaim or apologise. The engine teaches a five-step ladder and scores which step each sentence uses."},{kind:"table",columns:["Evidence you have","Say","Avoid"],rows:[["One small study","“These results suggest…”","“This proves…”"],["Several consistent studies","“There is consistent evidence that…”","“Everyone knows…”"],["A clear correlation","“X is associated with Y”","“X causes Y”"],["A null result","“We found no evidence of an effect at this sample size”","“There is no effect”"],["A guess","“One possible explanation, which we have not tested, is…”","Stating the guess as fact"]]}]},{id:"speaking-moves",title:"Moves for each moment",meta:"Phrasebank style, practised aloud",detail:[{kind:"text",text:"Phrases are grouped by what you are trying to do, in the style of Manchester’s Academic Phrasebank and Swales’ CARS model."},{kind:"list",items:["Establish the territory, show the gap, state your contribution (introductions and pitches).","Describe a method, report a result, state a limitation.","Ask a question at a talk: name the part, then ask one thing.","Answer a hard question: restate it, answer what you can, name what you would need to know the rest.","Take criticism: “That’s a fair point. The design can’t rule that out; a follow-up with X would.”","Say “I don’t know” well: “I haven’t looked at that. My guess is Y, and I’d check it by Z.”"]}]},{id:"speaking-drills",title:"Drills",meta:"Every drill is spoken and scored",detail:[{kind:"list",items:["Say it three ways: plain, precise, hedged.","Correct the overclaim.","Explain the term to a 12-year-old, then to a reviewer.","Use three new terms in a 60-second answer."]}]},{id:"speaking-real-life",title:"Measured in real life",meta:"Live coach in real meetings",detail:[{kind:"text",text:"In real lab meetings, the live coach counts how often the learner uses their terms correctly and how often their claims are ["0 Not started","Never attempted","None"],["1 Aware","Can recognise and define it","Card recall above 80%"],["2 Guided","Can do it with prompts","Passed a drill with hints"],["3 Independent","Can do it alone, correctly","Passed a timed drill or panel session unaided"],["4 Fluent","Can do it under pressure and explain it to others","Passed it in a mock conference, viva or real meeting"]]}]},{id:"mastery-rubric",title:"Example rubric",meta:"Present a paper at journal club",detail:[{kind:"text",text:"Each criterion is scored 1 to 4."},{kind:"list",items:["States the question and why it matters in 30 seconds.","Describes the method accurately.","Reports the main result with its size and uncertainty.","Names one real limitation.","Answers two panel questions without overclaiming.","Uses field terms correctly."]}]},{id:"mastery-readiness",title:"Research readiness view",meta:"Radar of the six pillars",detail:[{kind:"text",text:"Shows the six pillars as a radar, the current level, the next exit test, and the three weakest skills with a one-click drill for each. Scores decay slowly if a skill is not practised, which brings it back into the daily reps."}]},{id:"mastery-human-check",title:"Human sign-off",meta:"At levels 3 and 6",detail:[{kind:"text",text:"At levels 3 and 6 the learner can export the portfolio (cards, proposal, replication, talk recordings, scores) to share with a real mentor for sign-off."}]}]},{id:"fit",title:"How it fits the app",meta:"One screen on existing features",family:"build",detail:[{kind:"text",text:"Most of the engine already exists. Research Track adds one screen, a curriculum and a mastery model on top, and points the existing features at research."}],children:[{id:"fit-menu",title:"The Research screen",meta:"Under Prepare, six tabs",detail:[{kind:"text",text:"One new menu item: Research, under Prepare, with six tabs."},{kind:"facts",rows:[{label:"Today",value:"The daily list"},{label:"Ladder",value:"Levels and exit tests"},{label:"Papers",value:"Paper cards and the field map"},{label:"Terms",value:"The term bank"},{label:"Projects",value:"Proposal and replication tracker"},{label:"Readiness",value:"The radar and weakest skills"}]}]},{id:"fit-reuse",title:"Existing features reused",meta:"Eight features, new jobs",detail:[{kind:"facts",rows:[{label:"Notebook reading notes",value:"Becomes the paper card: three-pass fields added (question, method, result, limitation, my critique)"},{label:"Study flashcards and quizzes",value:"The spaced-retrieval engine for terms and paper cards"},{label:"Practice scenarios",value:"Mock conversation, Explain a topic and Check my script become the panel characters, 60-second explanations and talk rehearsal"},{label:"Academic and thesis-defence coaches",value:"The base for the Supervisor and Committee personas"},{label:"Plans and People research",value:"Preparing for a real supervisor meeting, and researching labs and professors to approach"},{label:"Live companion",value:"Coaching in real lab meetings, journal clubs and conference Q&A"},{label:"Progress",value:"Shows research readiness beside the speaking trends"},{label:"Library",value:"Holds the PDFs the learner reads"}]}]},{id:"fit-data",title:"New data",meta:"Local SQLite, five tables",detail:[{kind:"facts",rows:[{label:"research_track",value:"Field, goal (PhD application, first paper, industry research), level, weekly hours"},{label:"research_skills and research_evidence",value:"Each skill’s 0–4 score and the drill, test or session that proved it"},{label:"term_cards",value:"Term, definition, example, misuse, tier, source paper, and spaced-repetition fields (due date, interval, ease)"},{label:"paper_cards",value:"A link to the reading notebook plus the three-pass fields and the learner’s critique"},{label:"research_projects",value:"Proposal, replication and preprint milestones with links to code and files"}]}]},{id:"fit-curriculum",title:"Curriculum as data",meta:"Versioned JSON field packs",detail:[{kind:"text",text:"Levels, lessons, rubrics and the core term list ship as versioned JSON in the app, so content can be improved without code changes, and a field pack (for example speech science or machine learning) can be added as one file."}]}]},{id:"materials",title:"Materials top labs use",meta:"Checked September 2026",family:"build",detail:[{kind:"text",text:"The courses, essays, books and handbooks that research groups at Stanford, MIT, Bell Labs, DARPA and similar places hand to new people. Each link was opened and checked in September 2026. The app links to them and builds lessons and cards around them; it does not copy them."}],children:[{id:"materials-0",title:"Orientation reading",marker:"0",meta:"Four sources",children:[W("cs197","CS197: Computer Science Research","Michael Bernstein, Stanford","Free","The spine of the whole track: reading, questions, writing, speaking"),W("might","The Illustrated Guide to a PhD","Matt Might","Free","What “a contribution to knowledge” means"),W("karpathy","A Survival Guide to a PhD","Andrej Karpathy","Free","Problems, advisers, writing and talks"),W("oakley","Learning How to Learn","Oakley & Sejnowski","Free to audit","How the track’s study method works")]},{id:"materials-1",title:"Reader sources",marker:"1",meta:"Four sources",children:[W("keshav","How to Read a Paper","S. Keshav","Free","The three-pass method behind paper cards"),W("ng","Reading research papers","Andrew Ng, Stanford (CS230)","Free","How many papers to read, and how"),W("discovery","Semantic Scholar, Connected Papers, Zotero","AI2 and others","Free / freemium","Finding papers and building the field map"),W("openreview","OpenReview","OpenReview","Free","Real public reviews to compare your critique against")]},{id:"materials-2",title:"Question-maker sources",marker:"2",meta:"Five sources",children:[W("hamming","You and Your Research","Richard Hamming, Bell Labs","Free","Choosing important problems"),W("alon","How to Choose a Good Scientific Problem","Uri Alon, Weizmann","Free","Feasibility versus interest; being stuck is normal (with the cloud talk)"),W("heilmeier","The Heilmeier Catechism","DARPA","Free","The eight questions every proposal must pass"),W("schulman","An Opinionated Guide to ML Research","John Schulman","Free","Idea-driven versus goal-driven research"),W("booth","The Craft of Research, 5th ed.","Booth et al.","Paid","Questions, claims, evidence and argument")]},{id:"materials-3",title:"Methodologist sources",marker:"3",meta:"Six sources",children:[W("lakens","Improving Your Statistical Inferences","Daniël Lakens","Free","p-values, power and effect sizes"),W("mcelreath","Statistical Rethinking","Richard McElreath","Lectures free, book paid","Modelling and causal thinking"),W("turing","The Turing Way","Alan Turing Institute","Free","Reproducible, collaborative, ethical research"),W("osf","OSF and preregistration","Center for Open Science","Free","Preregistering the replication"),W("missing","The Missing Semester and The Carpentries","MIT CSAIL; The Carpentries","Free","Shell, git, data and code skills"),W("integrity","UKRIO and US Office of Research Integrity","UKRIO; HHS","Free","Research integrity and misconduct")]},{id:"materials-4",title:"Author sources",marker:"4",meta:"Five sources",children:[W("sainani","Writing in the Sciences","Kristin Sainani, Stanford","Free to audit","Clear scientific writing and peer review"),W("spj-paper","How to write a great research paper","Simon Peyton Jones","Free","Write to do the research; one clear idea"),W("mensh","Ten simple rules for structuring papers","Mensh & Kording","Free","Paper structure"),W("swales","Academic Writing for Graduate Students","Swales & Feak","Paid","The CARS model for introductions"),W("review-academies","Web of Science and Elsevier Researcher Academy","Clarivate; Elsevier","Free","Peer-review training")]},{id:"materials-5",title:"Communicator sources",marker:"5",meta:"Three sources",children:[W("spj-talk","How to give a great research talk","Simon Peyton Jones","Free","Talks that land"),W("phrasebank","Academic Phrasebank","University of Manchester","Free","Phrases by rhetorical move"),W("forrt","FORRT Glossary","FORRT, Nature Human Behaviour","Free","Vetted open-science terms")]},{id:"materials-6",title:"Independent researcher sources",marker:"6",meta:"One collection",children:[W("viva","St Andrews viva guide, Viva Survivors, Vitae","St Andrews; Nathan Ryder; Vitae","Free","Viva and defence preparation")]},{id:"materials-all",title:"For every level",meta:"Handbooks and indexes",children:[W("handbooks","Lab handbooks: Poldrack, Peelle, Aly","Poldrack, Peelle and Aly labs","Free","How real labs expect members to work"),W("eisner","Advice for Research Students and awesome-phd-advice","Jason Eisner, JHU; Paul Liang, CMU","Free","A curated index for going deeper")]},{id:"materials-gaps",title:"Two gaps",meta:"Where the track writes its own",detail:[{kind:"text",text:"There is no vetted source for writing to professors or handling conference Q&A, so the track writes its own lessons for both."},{kind:"callout",text:"Papers with Code shut down in July 2025; its replacement is Hugging Face Trending Papers."}]}]},{id:"limits",title:"Costs, privacy and limits",meta:"Credits, policy, honest limits",family:"build",children:[{id:"limits-credits",title:"Credits",meta:"Free ladder, AI steps on credits",detail:[{kind:"text",text:"Reading, flashcards and the ladder are free. Anything the AI does uses credits: writing paper cards from a PDF, panel sessions, scoring spoken drills, reviewing drafts. The app shows the cost before each one, as reading notes already do, and the Today list shows the day’s expected cost."},{kind:"callout",text:"A typical week at 10 hours should cost roughly the same as two to three hours of live session; the exact figure needs measuring in the beta."}]},{id:"limits-privacy",title:"Privacy",meta:"Policy updated before launch",detail:[{kind:"text",text:"Before launch, the Privacy Policy must name each new kind of content sent to the AI: the learner’s drafts, proposals, peer reviews and spoken drill answers. Papers and transcripts are already covered. This follows the house rule that the policy is updated before a new kind of content is sent."}]},{id:"limits-cannot",title:"What it cannot do",meta:"Four honest limits",detail:[{kind:"list",items:["It cannot replace a human mentor. Supervision quality is the biggest factor for PhD students; the track prepares the learner to find, impress and use a mentor well, and asks for one by level 3.","AI feedback can be confidently wrong. Every panel answer that cites a fact links to the paper it came from, and the learner is taught to check.","It cannot run experiments, get ethics approval or grant access to data. Version 1 suits computational and empirical fields (computer science, data science, psychology, speech and language, economics) better than wet-lab sciences.","It cannot promise to beat anyone. It removes the slow parts of the normal route; whether that closes a gap on someone who started years earlier depends on hours, problem choice and luck."]}]}]},{id:"build",title:"Build plan",meta:"Four phases, six decisions",family:"build",detail:[{kind:"text",text:"Four phases, each shippable on its own. The first gives a learner a daily habit within about a month of work. Weeks are one engineer’s time."}],children:[{id:"phase-a",title:"Reader",marker:"A",meta:"3–4 weeks, in progress",detail:[{kind:"facts",rows:[{label:"Weeks",value:"3–4"}]},{kind:"list",title:"Ships",items:["Research screen with Today, Ladder and Readiness","Levels 0–1","Term bank with spaced repetition (150 core terms plus terms from reading notes)","Paper cards on top of reading notes","Supervisor and Journal Club personas"]},{kind:"callout",text:"Started 26 Sep 2026 on branch feat/research-track."}]},{id:"phase-b",title:"Question-maker and methodologist",marker:"B",meta:"3 weeks",detail:[{kind:"facts",rows:[{label:"Weeks",value:"3"}]},{kind:"list",title:"Ships",item
